<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <header> <!-- Logo / Company Name-->
        <img id="logo" src="../images/image.png" alt="Intelligenz logo">
        <h1>Intelligenz Analytics - Jobs</h1>
      </header>
      <nav class="menu"> <!-- Menu / Navigation-->
        <ul>
          <li> <a href="index.html">Home</a></li>
          <li> <a href="jobs.html">Jobs</a></li>
          <li> <a href="apply.html">Apply</a></li>
          <li> <a href="about.html">About</a></li>
          <li> <a href="mailto:intelligenzanalytics@gmail.com">Email</a></li>
        </ul>
        </nav>

<form action="https://mercury.swin.edu.au/it000000/formtest.php" method="post" novalidate>

    <!-- Job Reference Number -->
    <label for="job-ref">Job Reference Number:</label>
    <select id="job-ref" name="job_ref" required>
        <option value="" disabled selected>Select a job reference number</option>
        <option value="1">Job Ref #001</option>
        <option value="2">Job Ref #002</option>
        <option value="3">Job Ref #003</option>
    </select>

    <!-- First Name -->
    <label for="first-name">First Name:</label>
    <input type="text" id="first-name" name="first_name" maxlength="20" pattern="[A-Za-z]{1,20}" required
           title="Only letters allowed, max length is 20.">

    <!-- Last Name -->
    <label for="last-name">Last Name:</label>
    <input type="text" id="last-name" name="last_name" maxlength="20" pattern="[A-Za-z]{1,20}" required
           title="Only letters allowed, max length is 20.">

    <!-- Date of Birth -->
    <label for="dob">Date of Birth (dd/mm/yyyy):</label>
    <input type="date" id="dob" name="dob" required>

    <!-- Gender -->
    <fieldset>
        <legend>Gender:</legend>
        <label for="male">
            <input type="radio" id="male" name="gender" value="Male" required> Male
        </label>
        <label for="female">
            <input type="radio" id="female" name="gender" value="Female"> Female
        </label>
        <label for="other">
            <input type="radio" id="other" name="gender" value="Other"> Other
        </label>
    </fieldset>

    <!-- Street Address -->
    <label for="address">Street Address:</label>
    <input type="text" id="address" name="address" maxlength="40" required>

    <!-- Suburb/Town -->
    <label for="suburb">Suburb/Town:</label>s
    <input type="text" id="suburb" name="suburb" maxlength="40" required>

    <!-- State -->
    <label for="state">State:</label>
    <select id="state" name="state" required>
        <option value="" disabled selected>Select your state</option>
        <option value="VIC">VIC</option>
        <option value="NSW">NSW</option>
        <option value="QLD">QLD</option>
        <option value="NT">NT</option>
        <option value="WA">WA</option>
        <option value="SA">SA</option>
        <option value="TAS">TAS</option>
        <option value="ACT">ACT</option>
    </select>

    <!-- Postcode -->
    <label for="postcode">Postcode:</label>
    <input type="text" id="postcode" name="postcode" pattern="\d{4}" required
           title="Postcode must be exactly 4 digits.">

    <!-- Email Address -->
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required
           pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" title="Please enter a valid email address.">

    <!-- Phone Number -->
    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" pattern="\d{8,12}" required
           title="Phone number must be between 8 to 12 digits.">

    <!-- Technical Skills -->
    <label>Technical Skills:</label>
    <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
    <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
    <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
    <label><input type="checkbox" name="skills" value="Python"> Python</label>

    <!-- Other Skills -->
    <label for="other-skills">Other Skills:</label>
    <textarea id="other-skills" name="other_skills" rows="4" cols="50"></textarea>

    <!-- Submit Button -->
    <button type="submit">Apply</button>
</form>

</body>
</html>
