<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply</title>
    <link rel="stylesheet" href="styles/style.css">
  </head>
  <body>
    <header> <!-- Logo / Company Name-->
      <img id="logo" src="images/image.png" alt="Intelligenz logo">
      <h1>Intelligenz Analytics</h1>
    </header>

    <form method="post" action="https://mercury.swin.edu.au/it000000/formtest.php">
      <fieldset>
        <legend>Personal information</legend>
        <p><label for="firstname">First Name</label>
          <input type="text" name="firstname" id="firstname" pattern="[A-za-z{20}]" required>
        </p>

        <p><label for="lastname">Last Name</label>
          <input type="text" name="lastname" id="lastname" pattern="[A-za-z{20}]" required>
        </p>

        <p><label for="dob">Date of Birth</label>
          <input type="text" id="dob" name="dob" placeholder="dd/mm/yyyy" pattern="\d{1,2}\/\d{1,2}\/\d{4}">
        </p>

        <legend>Gender</legend>
        <p><label for="male">Male</label>
          <input type="radio" id="male" name="gender" value="male" required>
        <label for="female">Female</label>
          <input type="radio" id="female" name="gender" value="female">
        <label for="other">Other</label>
          <input type="radio" id="other" name="gender" value="other">
        <label for="notgiven">Prefer not to answer</label>
          <input type="radio" id="none" name="gender" value="none">
        </p>
      </fieldset>

      <fieldset>
        
      </fieldset>
    </form>


  </body>
</html>
