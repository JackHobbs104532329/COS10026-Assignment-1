<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply</title>
    <link rel="stylesheet" href="styles/style.css">
  </head>
  <body>
    <header> <!-- Logo / Company Name-->
      <img id="logo" src="images/image.png" alt="Intelligenz logo">
      <h1>Intelligenz Analytics</h1>
    </header>

    <!--Form-->
    <form method="post" action="https://mercury.swin.edu.au/it000000/formtest.php">
      <fieldset>
        <legend>Personal information</legend>
        <p><label for="firstname">First Name</label>
          <input type="text" name="firstname" id="firstname" pattern="[A-za-z]{1,20}" required>
        </p>

        <p><label for="lastname">Last Name</label>
          <input type="text" name="lastname" id="lastname" pattern="[A-za-z{1,20}]" required>
        </p>

        <p><label for="dob">Date of Birth</label>
          <input type="text" id="dob" name="dob" placeholder="dd/mm/yyyy" pattern="\d{1,2}\/\d{1,2}\/\d{4}" required>
        </p>

        <legend>Gender</legend>
        <p><label for="male">Male</label>
          <input type="radio" id="male" name="gender" value="male" required>
        <label for="female">Female</label>
          <input type="radio" id="female" name="gender" value="female">
        <label for="other">Other</label>
          <input type="radio" id="other" name="gender" value="other">
        <label for="notgiven">Prefer not to answer</label>
          <input type="radio" id="none" name="gender" value="none">
        </p>
      </fieldset>

      <fieldset>
        <legend>Contact information</legend>
        <p><label for="address">Street Address</label>
          <input type="text" id="address" name="address" pattern="{40}" required> <!--Check pattern-->
        <p><label for="suburb">Suburb/Town</label>
          <input type="text" id="suburb" name="suburb" pattern="{40}" required> <!--Check pattern-->
        
        
        <p><label for="state">State</label>
          <select name="state" id="state" required>
            <option value="">Select</option>
            <option value="vic">VIC</option>
            <option value="nsw">NSW</option>
            <option value="qld">QLD</option>
            <option value="nt">NT</option>
            <option value="wa">WA</option>
            <option value="sa">SA</option>
            <option value="tas">TAS</option>
            <option value="act">ACT</option>
          </select>
        </p>
        
        
        <p><label for="postcode">Postcode</label>
          <input type="text" name="postcode" id="postcode" pattern="[0-9]{4}" required>
        </p>

        <p><label for="email">Email address</label>
          <input type="text" required> <!--Check pattern--> <!--pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$"-->
        </p>

        <p><label for="phone">Phone number</label>
          <input type="text" id="phone" name="phone" pattern="[0-9]{8,12}" required> <!--OR SPACES-->
        </p>
      </fieldset>

      <fieldset>
        <legend>Job information</legend>
        <p><label for="jobnumber">Job reference number</label> <!--JOB REFERENCE NUMBERS WILL BE 5 ALPHANUMERIC CHARACTERS-->
          <select name="jobnumber" id="jobnumber" required>
            <option value="">Select</option>
            <option value="dataanalyst">DATA REFNUMBER</option>
            <option value="servertechnician">SERVERTECH REFNUMBER</option>
          </select>
        </p>

        <legend>Technical experience</legend>
        <p><label for="python">Python</label>
          <input type="checkbox" id="python" name="experience[]" value="python" checked="checked">
        <label for="sql">SQL</label>
          <input type="checkbox" id="sql" name="experience[]" value="sql">
        <label for="c">C/C++</label>
          <input type="checkbox" id="c" name="experience[]" value="c">
        <label for="powershell">PowerShell</label>
          <input type="checkbox" id="powershell" name="experience[]" value="powershell">
        </p>

        <p><label for="skils">Other skills<br></label>
          <textarea id="skills" name="skills" rows="6" placeholder="Any other skills relevant to the job application"></textarea>
        </p>
      </fieldset>

      <!--Form submit button-->
      <p><input type="submit" value="Apply"></p>
    </form>
  </body>
</html>
